name: Diagnose hosted environment

# Manual, dispatch-only workflow used to measure the GitHub-hosted Windows
# image before a full regression run: PowerShell startup cost, helper exit
# codes, CIM latency, and the ACL chain the plugin privacy checks inspect.
# It also allows targeted test files so a fix can be validated in minutes
# instead of a multi-hour full-suite run.
on:
  workflow_dispatch:
    inputs:
      test_files:
        description: Space-separated test files to run (empty = probes only)
        required: false
        default: 'test/safe-workspace-read.test.mjs test/lease-lock-policy.test.mjs'
      test_name_pattern:
        description: Optional --test-name-pattern value
        required: false
        default: ''
      disable_defender:
        description: Disable Defender real-time protection before probe pass 2
        type: boolean
        required: false
        default: false
      defender_exclusions:
        description: Add Defender exclusions for the work tree and profile
        type: boolean
        required: false
        default: false
      warmup:
        description: Warm up PowerShell/csc/CIM before probe pass 2
        type: boolean
        required: false
        default: false
      probe_only:
        description: Skip running tests
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - name: Normalize runner storage ACLs
        shell: pwsh
        run: |
          $acl = Get-Acl -LiteralPath $env:USERPROFILE
          $acl.SetAccessRuleProtection($true, $false)
          foreach ($rule in @($acl.Access)) { [void]$acl.RemoveAccessRuleAll($rule) }
          $current = [Security.Principal.WindowsIdentity]::GetCurrent().User
          foreach ($sid in @($current, [Security.Principal.SecurityIdentifier]::new('S-1-5-18'), [Security.Principal.SecurityIdentifier]::new('S-1-5-32-544'))) {
            $rule = New-Object Security.AccessControl.FileSystemAccessRule($sid, [Security.AccessControl.FileSystemRights]::FullControl, [Security.AccessControl.InheritanceFlags]'ContainerInherit, ObjectInherit', [Security.AccessControl.PropagationFlags]::None, [Security.AccessControl.AccessControlType]::Allow)
            $acl.AddAccessRule($rule)
          }
          Set-Acl -LiteralPath $env:USERPROFILE -AclObject $acl
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
      - name: Install locked dependencies
        run: npm ci --prefix scripts --omit=optional --ignore-scripts --no-audit --no-fund
      - name: Install and pin the offline Codex CLI fixture
        shell: pwsh
        run: |
          $pluginData = Join-Path $env:USERPROFILE '.otui-ci-plugin-data'
          $cliRoot = Join-Path $pluginData 'runtime\cli'
          $env:PLUGIN_DATA = $pluginData
          $runtimeRoot = Join-Path $pluginData 'runtime'
          New-Item -ItemType Directory -Path $runtimeRoot -Force | Out-Null
          $env:npm_config_prefix = $cliRoot
          $nodeExe = (Get-Command node.exe -CommandType Application | Select-Object -First 1).Source
          $npmCli = Join-Path (Split-Path -Parent $nodeExe) 'node_modules\npm\bin\npm-cli.js'
          $installOutput = (& $nodeExe $npmCli install --global --prefix $cliRoot --ignore-scripts --no-audit --no-fund --include=optional '@openai/codex@0.162.1' 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Pinned Codex CLI fixture install failed: $installOutput" }
          $reportText = (& $nodeExe scripts/runtime-prepare.mjs 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Pinned Codex CLI verification failed: $reportText" }
          "PLUGIN_DATA=$pluginData" >> $env:GITHUB_ENV
          "PATH=$cliRoot;$env:PATH" >> $env:GITHUB_ENV
          "ORCH_NODE_EXE=$nodeExe" >> $env:GITHUB_ENV
      - name: Write probe scripts
        shell: pwsh
        run: |
          $probe = Join-Path $env:RUNNER_TEMP 'private-probe.mjs'
          @'
          const [,,target,moduleUrl]=process.argv;
          try {
            const m=await import(moduleUrl);
            m.assertPrivateWindowsRoot(target,{powershell:'C:/Windows/System32/WindowsPowerShell/v1.0/powershell.exe'});
            console.log('PRIVATE_OK');
          } catch (error) { console.log('PRIVATE_FAIL: '+error.message); }
          '@ | Set-Content -LiteralPath $probe -Encoding utf8
          $runner = Join-Path $env:RUNNER_TEMP 'hosted-probes.ps1'
          @'
          param([string]$Label)
          $ps = 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
          $repo = $env:GITHUB_WORKSPACE
          function Time-Probe([string]$name,[scriptblock]$body) {
            $sw=[Diagnostics.Stopwatch]::StartNew(); $result=& $body; $sw.Stop()
            Write-Host ("{0} | {1} | {2} ms | {3}" -f $Label,$name,$sw.ElapsedMilliseconds,$result)
          }
          Time-Probe 'powershell-start' { (& $ps -NoLogo -NoProfile -NonInteractive -Command 'exit 42' | Out-Null); "exit=$LASTEXITCODE" }
          Time-Probe 'powershell-start-2' { (& $ps -NoLogo -NoProfile -NonInteractive -Command 'exit 42' | Out-Null); "exit=$LASTEXITCODE" }
          Time-Probe 'cim-query' { $n=@(Get-CimInstance Win32_Process -OperationTimeoutSec 30).Count; "count=$n" }
          $req = '{"version":1,"operation":"bind-root","root":"' + ($repo -replace '\\','\\') + '"}'
          $helper = Join-Path $repo 'scripts\core\safe-workspace-read.ps1'
          Time-Probe 'safe-read-bind-root' { $o = $req | & $ps -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $helper 2>&1 | Out-String; "exit=$LASTEXITCODE out=$($o.Trim().Substring(0,[Math]::Min(60,$o.Trim().Length)))" }
          $probeDir = Join-Path $env:USERPROFILE ('.diag-private-' + [Guid]::NewGuid().ToString('N').Substring(0,8))
          New-Item -ItemType Directory -Path $probeDir -Force | Out-Null
          $moduleUrl = 'file:///' + (($repo -replace '\\','/')) + '/scripts/core/private-root.mjs'
          $probeScript = Join-Path $env:RUNNER_TEMP 'private-probe.mjs'
          Time-Probe 'private-root-assert' { $o = & node $probeScript $probeDir $moduleUrl 2>&1 | Out-String; $o.Trim() }
          Time-Probe 'private-root-assert-2' { $o = & node $probeScript $probeDir $moduleUrl 2>&1 | Out-String; $o.Trim() }
          '@ | Set-Content -LiteralPath $runner -Encoding utf8
      - name: Environment facts (baseline)
        shell: pwsh
        run: |
          whoami
          "cores: $([Environment]::ProcessorCount)"
          "memory-gb: $([Math]::Round((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB, 1))"
          $mp = Get-MpPreference
          "defender-realtime-disabled: $($mp.DisableRealtimeMonitoring)"
          "defender-exclusions: $($mp.ExclusionPath -join '; ')"
          foreach ($p in @('C:\','C:\Users',$env:USERPROFILE,(Join-Path $env:USERPROFILE '.codex'),$env:RUNNER_TEMP,$env:GITHUB_WORKSPACE)) {
            if ($p -and (Test-Path -LiteralPath $p)) {
              "== ACL $p"
              (Get-Acl -LiteralPath $p).Access | ForEach-Object { "   {0} | {1} | {2} | inherited={3} | {4}" -f $_.IdentityReference, $_.FileSystemRights, $_.AccessControlType, $_.IsInherited, $_.PropagationFlags }
            }
          }
      - name: Write helper timing probe
        shell: pwsh
        run: |
          $probe = Join-Path $env:RUNNER_TEMP 'helper-timing-probe.mjs'
          @'
          import {spawnSync} from 'node:child_process';
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';

          const repo=process.argv[2];
          const repoUrl='file:///'+repo.replace(/\\/g,'/')+'/scripts/core/windows-system.mjs';
          const {controllerEnvironment,trustedWindowsHelper}=await import(repoUrl);
          const helper=repo.replace(/\\/g,'/')+'/scripts/core/safe-workspace-read.ps1';
          const root=fs.mkdtempSync(path.join(os.tmpdir(),'diag-safe-read-'));
          const request=JSON.stringify({version:1,operation:'bind-root',root});

          function run(label,env){
            const t0=Date.now();
            const r=spawnSync(trustedWindowsHelper('powershell'),['-NoLogo','-NoProfile','-NonInteractive','-ExecutionPolicy','Bypass','-File',helper],{input:request,encoding:'utf8',windowsHide:true,shell:false,timeout:60000,env});
            console.log(`${label} | ms=${Date.now()-t0} | status=${r.status} | signal=${r.signal} | err=${r.error?.code||''} | out=${String(r.stdout||'').trim().slice(0,48)}`);
          }

          function runCommand(label,env,command){
            const t0=Date.now();
            const r=spawnSync(trustedWindowsHelper('powershell'),['-NoLogo','-NoProfile','-NonInteractive','-ExecutionPolicy','Bypass','-Command',command],{encoding:'utf8',windowsHide:true,shell:false,timeout:60000,env});
            console.log(`${label} | ms=${Date.now()-t0} | status=${r.status} | signal=${r.signal} | err=${r.error?.code||''} | out=${String(r.stdout||'').trim().slice(0,48)}`);
          }

          const controlled=controllerEnvironment();
          const controlledKeys=new Set(Object.keys(controlled).map((k)=>k.toLowerCase()));
          const dropped=Object.keys(process.env).filter((k)=>!controlledKeys.has(k.toLowerCase())).sort();
          console.log('dropped-count='+dropped.length);
          function envMinus(list){const e={...process.env};for(const k of list)delete e[k];return e;}

          const addtype="Add-Type -TypeDefinition 'public class DiagX{}'; 'ok'";
          function classify(env,command=addtype,label='addtype'){
            const t0=Date.now();
            const r=spawnSync(trustedWindowsHelper('powershell'),['-NoLogo','-NoProfile','-NonInteractive','-ExecutionPolicy','Bypass','-Command',command],{encoding:'utf8',windowsHide:true,shell:false,timeout:20000,env});
            const ms=Date.now()-t0;
            const slow=r.error?.code==='ETIMEDOUT'||ms>10000;
            console.log(`${label} | ms=${ms} | slow=${slow} | status=${r.status} | err=${r.error?.code||''}`);
            return {slow,ms};
          }

          const cscScript=[
            "$src=Join-Path $env:TEMP 'diag-csc.cs'",
            "Set-Content -LiteralPath $src -Value 'public class DiagCsc{}' -Encoding ascii",
            "$out=Join-Path $env:TEMP 'diag-csc.dll'",
            "$csc=Join-Path $env:SystemRoot 'Microsoft.NET\\Framework64\\v4.0.30319\\csc.exe'",
            "$sw=[Diagnostics.Stopwatch]::StartNew()",
            "& $csc /nologo /noconfig /target:library /out:$out $src | Out-Null",
            "$sw.Stop(); 'csc-ms='+$sw.ElapsedMilliseconds+' exit='+$LASTEXITCODE",
          ].join(';');

          classify(process.env,addtype,'A-addtype-ambient');
          classify(controlled,addtype,'B-addtype-controller');
          classify(process.env,cscScript,'C-csc-ambient');
          classify(controlled,cscScript,'D-csc-controller');
          classify(envMinus(['PSModulePath']),addtype,'E-minus-PSModulePath');
          classify(envMinus(['PSModulePath','PSModuleAnalysisCachePath']),addtype,'F-minus-PSModulePath-AnalysisCachePath');
          classify(envMinus(['USERNAME','USERDOMAIN','LOGONSERVER','USERDOMAIN_ROAMINGPROFILE','COMPUTERNAME']),addtype,'G-minus-identity');
          classify(envMinus(['PROCESSOR_LEVEL','PROCESSOR_REVISION']),addtype,'H-minus-processor');
          classify(envMinus(['ProgramFiles','ProgramFiles(x86)','ProgramW6432','ProgramData','CommonProgramFiles','CommonProgramFiles(x86)','CommonProgramW6432','SystemDrive']),addtype,'I-minus-program-paths');
          classify(envMinus(['POWERSHELL_UPDATECHECK','POWERSHELL_DISTRIBUTION_CHANNEL','ImageOS','ImageVersion']),addtype,'J-minus-image');
          '@ | Set-Content -LiteralPath $probe -Encoding utf8
      - name: Helper timing matrix (production env)
        shell: pwsh
        run: '& $env:ORCH_NODE_EXE (Join-Path $env:RUNNER_TEMP ''helper-timing-probe.mjs'') (Get-Location).Path'
      - name: Probe pass 1 (baseline)
        shell: pwsh
        run: '& (Join-Path $env:RUNNER_TEMP ''hosted-probes.ps1'') -Label baseline'
      - name: Apply optional transformations
        if: ${{ inputs.disable_defender || inputs.defender_exclusions || inputs.warmup }}
        shell: pwsh
        run: |
          if ('${{ inputs.defender_exclusions }}' -eq 'true') {
            try { Add-MpPreference -ExclusionPath @($env:GITHUB_WORKSPACE, $env:USERPROFILE, $env:RUNNER_TEMP, $env:PLUGIN_DATA) -ErrorAction Stop; 'exclusions added' } catch { "exclusions failed: $($_.Exception.Message)" }
          }
          if ('${{ inputs.disable_defender }}' -eq 'true') {
            try { Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction Stop; "realtime-disabled now: $((Get-MpPreference).DisableRealtimeMonitoring)" } catch { "disable failed: $($_.Exception.Message)" }
          }
          if ('${{ inputs.warmup }}' -eq 'true') {
            & (Join-Path $env:RUNNER_TEMP 'hosted-probes.ps1') -Label warmup | Out-Null
            & (Join-Path $env:RUNNER_TEMP 'hosted-probes.ps1') -Label warmup-2 | Out-Null
            'warmup done'
          }
      - name: Probe pass 2 (after)
        if: ${{ inputs.disable_defender || inputs.defender_exclusions || inputs.warmup }}
        shell: pwsh
        run: '& (Join-Path $env:RUNNER_TEMP ''hosted-probes.ps1'') -Label after'
      - name: Configure offline test host
        shell: pwsh
        run: |
          "ORCH_AGENT=codex" >> $env:GITHUB_ENV
          "ORCH_SANDBOX=read-only" >> $env:GITHUB_ENV
          "ORCH_APPROVAL=never" >> $env:GITHUB_ENV
          "PATH=$env:GITHUB_WORKSPACE\scripts;$env:PATH" >> $env:GITHUB_ENV
      - name: Run selected tests
        if: ${{ !inputs.probe_only && inputs.test_files != '' }}
        shell: pwsh
        run: |
          $files = '${{ inputs.test_files }}'.Split(' ', [StringSplitOptions]::RemoveEmptyEntries)
          $pattern = '${{ inputs.test_name_pattern }}'
          $arguments = @('--import', './test/host-context-isolation.mjs', '--test', '--test-concurrency=1')
          if ($pattern) { $arguments += @('--test-name-pattern', $pattern) }
          $arguments += $files
          & $env:ORCH_NODE_EXE @arguments
          "test exit code: $LASTEXITCODE"
