name: CI

on:
  push:
  pull_request:

jobs:
  gate:
    name: Static + integrity gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax check (node --check)
        run: |
          set -e
          for f in $(find scripts -type f -name '*.mjs'); do
            echo "node --check $f"
            node --check "$f"
          done
          node --check repair.mjs

      - name: Repair / integrity gate (repair.mjs)
        run: node repair.mjs

      - name: Force enforcement gate loads (--status)
        run: |
          # Only verifies the gate module parses and loads; CI has no workspace windows.
          node scripts/codex-tui-orchestrator-force.mjs --status || true

      - name: Upload security report artifact (if present)
        uses: actions/upload-artifact@v4
        if: hashFiles('**/report.md') != ''
        with:
          name: codex-security-report
          path: '**/report.md'

