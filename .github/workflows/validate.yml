name: Validate orchestrator

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: windows-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Record Node runtime
        shell: pwsh
        run: |
          node --version
          node -p "process.execPath"
      - name: Install locked dependencies
        run: npm ci --prefix scripts --omit=optional --ignore-scripts --no-audit --no-fund
      - name: Install and pin the offline Codex CLI fixture
        shell: pwsh
        run: |
          # Runtime storage must be a directory whose ACL grants write access
          # only to the current user, SYSTEM, and Administrators; the runner's
          # shared temp volume fails that check, so keep it under the profile.
          $pluginData = Join-Path $env:USERPROFILE '.otui-ci-plugin-data'
          $cliRoot = Join-Path $pluginData 'runtime\cli'
          $env:PLUGIN_DATA = $pluginData
          $env:npm_config_prefix = $cliRoot
          $nodeExe = (Get-Command node.exe -CommandType Application | Select-Object -First 1).Source
          $npmCli = Join-Path (Split-Path -Parent $nodeExe) 'node_modules\npm\bin\npm-cli.js'
          if (-not (Test-Path -LiteralPath $npmCli -PathType Leaf)) { throw "npm CLI entry was not found: $npmCli" }
          # Seed the private fixture with the exact pinned package before the
          # production preparation path runs. The preparation path then
          # verifies the native binary and the complete platform tree, while
          # no unverified npm bypass is enabled in either step.
          $installOutput = (& $nodeExe $npmCli install --global --prefix $cliRoot --ignore-scripts --no-audit --no-fund --include=optional '@openai/codex@0.162.1' 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Pinned Codex CLI fixture install failed: $installOutput" }
          $env:ORCH_AUTO_INSTALL_CLI = '0'
          $env:ORCH_AUTO_INSTALL_DEPS = '0'
          $reportText = (& $nodeExe scripts/runtime-prepare.mjs 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Pinned Codex CLI verification failed: $reportText" }
          $report = $reportText | ConvertFrom-Json
          if (-not $report.ok -or $report.stage -ne 'ready') { throw "Pinned Codex CLI verification returned an invalid report: $reportText" }
          $cli = [string]$report.cliPath
          $version = (& $cli --version 2>$null | Out-String).Trim()
          if ($version -ne 'codex-cli 0.162.1') { throw "Unexpected Codex CLI version: $version" }
          "PLUGIN_DATA=$pluginData" >> $env:GITHUB_ENV
          "PATH=$cliRoot;$env:PATH" >> $env:GITHUB_ENV
          "ORCH_AUTO_INSTALL_CLI=0" >> $env:GITHUB_ENV
          "ORCH_AUTO_INSTALL_DEPS=0" >> $env:GITHUB_ENV
          "ORCH_NODE_EXE=$nodeExe" >> $env:GITHUB_ENV
      - name: Exercise trusted automatic CLI installation
        shell: pwsh
        run: |
          $nodeExe = $env:ORCH_NODE_EXE
          $autoData = Join-Path $env:USERPROFILE '.otui-ci-plugin-data-auto'
          $autoRoot = Join-Path $autoData 'runtime\cli'
          $npmCli = Join-Path (Split-Path -Parent $nodeExe) 'node_modules\npm\bin\npm-cli.js'
          foreach ($name in @('npm_execpath','NPM_EXEC_PATH','ORCH_NPM_TRUSTED','ORCH_NPM_TRUSTED_PATH','ORCH_NPM_TRUSTED_SHA256','ORCH_ALLOW_UNVERIFIED_NPM','npm_config_prefix','NPM_CONFIG_PREFIX')) {
            Remove-Item -LiteralPath ("Env:" + $name) -ErrorAction SilentlyContinue
          }
          $env:PLUGIN_DATA = $autoData
          $env:npm_config_prefix = $autoRoot
          $env:npm_execpath = $npmCli
          # Attest the exact npm entry consumed by the bootstrap guard.
          $npmEntry = [IO.Path]::GetFullPath($npmCli)
          $npmDigest = (Get-FileHash -LiteralPath $npmEntry -Algorithm SHA256).Hash.ToLowerInvariant()
          $env:ORCH_NPM_TRUSTED_PATH = $npmEntry
          $env:ORCH_NPM_TRUSTED_SHA256 = $npmDigest
          $env:ORCH_NPM_TRUSTED = '1'
          $env:ORCH_AUTO_INSTALL_CLI = '1'
          $env:ORCH_AUTO_INSTALL_DEPS = '0'
          $env:ORCH_AGENT = 'codex'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'codex-no-desktop'
          $env:PATH = (Split-Path -Parent $nodeExe) + ';' + (Join-Path $env:SystemRoot 'System32')
          $envProbe = (& $nodeExe -e "const fs=require('fs'),path=require('path');const e=process.env.npm_execpath;process.stdout.write(JSON.stringify({absolute:path.isAbsolute(e||''),regular:!!e&&fs.lstatSync(e).isFile(),trusted:process.env.ORCH_NPM_TRUSTED}))" | ConvertFrom-Json)
          if (-not $envProbe.absolute -or -not $envProbe.regular -or $envProbe.trusted -ne '1') { throw 'Trusted npm environment was not visible to Node.' }
          $reportText = (& $nodeExe scripts/runtime-prepare.mjs 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Trusted automatic CLI installation failed: $reportText" }
          $report = $reportText | ConvertFrom-Json
          if (-not $report.ok -or $report.stage -ne 'ready') { throw "Trusted automatic CLI installation returned an invalid report: $reportText" }
          $version = (& $report.cliPath --version 2>$null | Out-String).Trim()
          if ($version -ne 'codex-cli 0.162.1') { throw "Unexpected automatically installed CLI version: $version" }
      - name: Configure offline test host
        shell: pwsh
        run: |
          "ORCH_AGENT=codex" >> $env:GITHUB_ENV
          "ORCH_SANDBOX=read-only" >> $env:GITHUB_ENV
          "ORCH_APPROVAL=never" >> $env:GITHUB_ENV
          "PATH=$env:GITHUB_WORKSPACE\scripts;$env:PATH" >> $env:GITHUB_ENV
      - name: Run offline regression suite
        shell: pwsh
        run: '& $env:ORCH_NODE_EXE --import ./test/host-context-isolation.mjs --test --test-concurrency=1 test/*.test.mjs'
      - name: Verify release integrity
        shell: pwsh
        run: '& $env:ORCH_NODE_EXE scripts/release-integrity.mjs'
