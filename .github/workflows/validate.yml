name: Validate orchestrator

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: windows-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install locked dependencies
        run: npm ci --prefix scripts --omit=optional --ignore-scripts --no-audit --no-fund
      - name: Configure offline test host
        shell: pwsh
        run: |
          "ORCH_AGENT=codex" >> $env:GITHUB_ENV
          "PATH=$env:GITHUB_WORKSPACE\scripts;$env:PATH" >> $env:GITHUB_ENV
      - name: Run offline regression suite
        run: node --test --test-concurrency=1 test/*.test.mjs
      - name: Verify release integrity
        run: node scripts/release-integrity.mjs
