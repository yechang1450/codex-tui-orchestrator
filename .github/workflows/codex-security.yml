name: Codex Security Scan

# Runs a real codex-security headless scan whenever the plugin's model-backed audit
# credentials are available. Without the secret the job is skipped so PRs/forks stay green.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: codex-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Headless codex-security scan (findings + report)
    runs-on: ubuntu-latest
    # SKIP if no model credentials are configured; the finding audit is agent/LLM-driven.
    if: ${{ secrets.CODEX_SECURITY_API_KEY != '' && secrets.CODEX_SECURITY_MODEL != '' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The codex-security plugin ships its own Python workbench + MCP server. In CI we drive
      # the same headless standard scan via workbench_db.py and finalize_scan_contract.py.
      # (The finding audit is performed by the model-backed agent per the security-scan SKILL.)
      - name: Run headless standard scan
        env:
          CODEX_SECURITY_API_KEY: ${{ secrets.CODEX_SECURITY_API_KEY }}
          CODEX_SECURITY_MODEL: ${{ secrets.CODEX_SECURITY_MODEL }}
        run: |
          set -e
          SCAN_ROOT="$RUNNER_TEMP/codex-security-scans"
          mkdir -p "$SCAN_ROOT"
          # Vendor the codex-security plugin scripts (standalone Python workbench).
          # Replace with a pinned fetch if you do not vendor them in-repo.
          CS="${GITHUB_WORKSPACE}/.codex-security"
          if [ ! -d "$CS/scripts" ]; then
            echo "::warning::codex-security plugin scripts not vendored; scan step is inert. Vendor $CS/scripts or set CODEX_SECURITY_SCRIPTS_DIR."
            exit 0
          fi
          python "$CS/scripts/workbench_db.py" start-headless-standard-scan \
            --thread-id "ci-${{ github.sha }}" \
            --target-path "$GITHUB_WORKSPACE" \
            --scope . \
            --target-summary "CI codex-security scan @ ${{ github.sha }}" \
            --scan-root "$SCAN_ROOT" \
            --model "$CODEX_SECURITY_MODEL" > "$RUNNER_TEMP/scan-start.json"

      - name: Upload findings + report artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: codex-security-scan
          path: |
            **/report.md
            **/findings.json
            **/scan-manifest.json
            **/coverage.json
          if-no-files-found: ignore
